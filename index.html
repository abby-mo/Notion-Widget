<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Notion Calendar Widget</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="calendar-container">
    <div class="inner-container">

      <div class="header">
        <span id="year"></span>
        <div class="month-navigation">
          <button id="prevMonth" type="button" aria-label="Previous month">
            <svg class="nav-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <polyline points="15 6 9 12 15 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <h2 id="month"></h2>
          <button id="nextMonth" type="button" aria-label="Next month">
            <svg class="nav-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <polyline points="9 6 15 12 9 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>

      <table id="calendar">
        <thead>
          <tr>
            <th>S</th>
            <th>M</th>
            <th>T</th>
            <th>W</th>
            <th>T</th>
            <th>F</th>
            <th>S</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </div>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Edit colors" aria-expanded="false" aria-controls="theme-panel" title="Edit colors"></button>

    <div class="theme-panel" id="theme-panel" aria-label="Color theme" hidden>
      <label class="theme-swatch" title="Accent">
        <input type="color" data-keys="header-bg,current-day-bg" id="color-accent" />
        <span>Accent</span>
      </label>
      <label class="theme-swatch" title="Header text">
        <input type="color" data-keys="header-text" id="color-header-text" />
        <span>Header</span>
      </label>
      <label class="theme-swatch" title="Background">
        <input type="color" data-keys="calendar-bg" id="color-bg" />
        <span>Body</span>
      </label>
      <label class="theme-swatch" title="Day text">
        <input type="color" data-keys="day-text,weekday-color" id="color-day-text" />
        <span>Text</span>
      </label>
      <label class="theme-swatch" title="Today text">
        <input type="color" data-keys="current-day-text" id="color-today-text" />
        <span>Today</span>
      </label>
      <button type="button" class="theme-reset" id="theme-reset" title="Reset colors">Reset</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
